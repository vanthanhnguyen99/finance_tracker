pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1m;
  client_body_timeout 15s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 45s;
  upstream finance_app { server app:3000; }
  server {
    listen 8080;
    server_name financetracker.wt.id.vn;
    # The remote cloudflared connector is the only permitted origin caller.
    allow 192.168.10.177;
    deny all;
    location / {
      if ($http_cf_connecting_ip = "") { return 400; }
      proxy_pass http://finance_app;
      proxy_http_version 1.1;
      proxy_set_header Host financetracker.wt.id.vn;
      proxy_set_header X-Forwarded-Host financetracker.wt.id.vn;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Nonce "";
      proxy_set_header X-Middleware-Subrequest "";
      proxy_set_header Connection "";
      proxy_request_buffering on;
      proxy_buffering off;
    }
  }
}
